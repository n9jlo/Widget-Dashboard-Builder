openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: telemetry
    description: Live dashboard telemetry
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /telemetry/snapshot:
    get:
      operationId: getTelemetrySnapshot
      tags: [telemetry]
      summary: Get the available telemetry sources and latest readings
      responses:
        "200":
          description: Initial source catalog and recent sample values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySnapshot"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TelemetrySnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/TelemetrySource"
      required:
        - generatedAt
        - sources
    TelemetrySource:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        unit:
          type: string
        value:
          type: number
        min:
          type: number
        max:
          type: number
        status:
          type: string
          enum: [active, warning, idle]
        history:
          type: array
          items:
            type: number
      required:
        - key
        - label
        - unit
        - value
        - min
        - max
        - status
        - history

